name: Test Dev Reusable Workflow

on:
  workflow_call:

jobs:
  test-dev:
    name: Test Dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install goRP
        run: |
          curl -s https://api.github.com/repos/reportportal/goRP/releases/latest | \
            jq -r '.assets[] | select(.name | contains ("tar.gz")) | .browser_download_url' | \
            grep "$(uname)_$(arch)" | \
            xargs curl -sL | sudo tar zx -C /usr/local/bin

          # Verify installation
          gorp --version

      - name: Setup environment
        run: ./script/setup-dev
        env:
          CI: true

      - name: Run tests
        run: ./script/test-dev
        env:
          AGENT_NO_ANALYTICS: true
          # goRP configuration based on README.md
          GORP_UUID: ${{ secrets.RP_API_KEY }}
          GORP_PROJECT: ${{ vars.RP_PROJECT }}
          GORP_HOST: ${{ vars.RP_URL }}
          # Launch configuration
          LAUNCH_NAME: "Learn Testing | Go Unit Tests | ${{ github.ref_name }}"
          LAUNCH_DESCRIPTION: |
            ### Launch Details
            - **Repository**: [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})
            - **Ref**: [`${{ github.ref }}`](${{ github.server_url }}/${{ github.repository }}/${{ startsWith(github.ref, 'refs/pull/') && format('pull/{0}', github.event.pull_request.number) || startsWith(github.ref, 'refs/tags/') && format('releases/tag/{0}', github.ref_name) || format('tree/{0}', github.ref_name) }})
            - **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Run**: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Run Attempt**: [${{ github.run_attempt }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})
            - **Environment**: Development
            - **Triggered By**: [@${{ github.actor }}](${{ github.server_url }}/${{ github.actor }})
            - **Event**: `${{ github.event_name }}`
          # Launch attributes using goRP format (key:value)
          LAUNCH_ATTRIBUTES: >-
            github.actor:${{ github.actor }}
            github.ref:${{ github.ref }}
            github.commit:${{ github.sha }}
            github.environment:development
            github.repository:${{ github.repository }}
            github.run.id:${{ github.run_id }}
            github.workflow:${{ github.workflow }}
            team.workstream:learn-testing
            test.source:github-actions
            test.implementation:go-test
            test.type:unit


      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-results
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 3

      - name: Generate Go coverage report
        run: |
          cd backend
          go test -coverprofile=coverage.out -v
          go tool cover -html=coverage.out -o coverage.html
        if: always()

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.branch.name=main
            -Dsonar.go.coverage.reportPaths=backend/coverage.out
